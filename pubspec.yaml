name: lipa_agent
description: "Lipa — application mobile agent (cash-in/out, enrôlement client, cartes, commissions)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management & DI
  flutter_riverpod: ^3.4.3

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^11.2.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Receipts & statements: generate a PDF locally and open the system
  # print/preview sheet (save/share), plus a native share sheet for text.
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^13.3.1

  # KYC document capture / pick (camera + gallery).
  image_picker: ^1.1.2

  # Real NFC tag reading for card scanning (spec §5.4). Phones without an NFC
  # chip fall back to manual UID entry; even on NFC phones the agent can opt
  # into manual entry. Abstracted behind the Scanner seam (see core/scan).
  nfc_manager: 4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates Android/iOS launcher icons from a single source PNG.
  # Dev-only: it does not ship in the built app.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Lipa design system fonts, shipped with the app (no download at runtime:
  # agents often work with a weak network). Licences: assets/fonts/OFL-*.txt.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

  # Open Sans is only used by the PDF receipts (it has the minus sign U+2212).
  assets:
    - assets/fonts/OpenSans-Regular.ttf
    - assets/fonts/OpenSans-Bold.ttf

# App launcher icon configuration.
# Uses the same Lipa logo as the customer app (assets/icon/lipa_icon.png),
# then run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/lipa_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#F6F4EF"
